faulted_ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: false
    publish_acceleration: false
    print_diagnostics: true

    world_frame: odom
    odom_frame: odom
    base_link_frame: base_footprint

    odom0: /faulted/wheel/odometry
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    imu0: /faulted/imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
