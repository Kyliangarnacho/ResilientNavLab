/**:
  ros__parameters:
    # Pinned MurpheyLab/brne runtime algorithm profile.
    maximum_agents: 5
    num_samples: 196
    dt: 0.1
    plan_steps: 25
    kernel_a1: 0.2
    kernel_a2: 0.2
    cost_a1: 15.0
    cost_a2: 3.0
    cost_a3: 20.0
    ped_sample_scale: 0.1

    # ResilientNavLab robot and Scene 1--3 runtime profile.
    input_timeout_sec: 0.5
    replan_frequency_hz: 5.0
    max_linear_velocity: 0.30
    max_angular_velocity: 0.80
    nominal_linear_velocity: 0.20
    corridor_y_min: -2.0
    corridor_y_max: 2.0
    close_stop_threshold: 0.20
    goal_tolerance: 0.20

    # Unified interaction lifecycle and mutually exclusive event classifier.
    interaction_entry_distance: 3.20
    interaction_separation_margin: 0.20
    interaction_distance_history_outputs: 4
    crossing_lateral_speed_threshold: 0.08
    crossing_minimum_lateral_alignment: 0.50
    crossing_time_max: 4.0
    crossing_forward_min: 0.20
    crossing_forward_max: 2.00
    crossing_side_bias_multiplier: 10.0
    crossing_preferred_safety_weight: 0.10
    crossing_initial_direction_window_outputs: 5
    head_on_minimum_approach_speed: 0.12
    head_on_maximum_direction_angle_rad: 1.05
    head_on_lateral_direction_deadband_rad: 0.17
    head_on_release_path_clearance: 0.58

    # Passing-side proposal support; this changes proposal support, not output sign.
    proposal_opposite_scale: 0.25
    proposal_opposite_threshold: 0.35
    proposal_protection_window_outputs: 5
    proposal_protection_output_deadband: 0.05

    # Sensor-input tracker. Global planning uses only the saved static map.
    maximum_scan_age_sec: 0.25
    transform_timeout_sec: 0.05
    cluster_gap: 0.12
    minimum_cluster_points: 3
    maximum_usable_range: 6.0
    maximum_dynamic_agent_range: 4.0
    maximum_track_diameter: 0.60
    association_distance: 0.35
    minimum_common_matches: 3
    history_size: 6
    minimum_confirmations: 6
    common_motion_inlier_distance: 0.02
    dynamic_minimum_speed: 0.08
    dynamic_minimum_displacement: 0.04
    direction_consistency: 0.75
    minimum_direction_step: 0.005
    velocity_ema_alpha: 0.25
    velocity_ema_stability_window: 3
    velocity_ema_max_direction_change_rad: 0.35
    velocity_ema_outlier_direction_change_rad: 0.70
    stationary_maximum_speed: 0.04
    stationary_confirmation_frames: 8
