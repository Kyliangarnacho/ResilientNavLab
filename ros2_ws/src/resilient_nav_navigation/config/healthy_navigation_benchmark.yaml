# Frozen Phase 10 Task 4 healthy-navigation benchmark contract.
# GT is evaluator-only; this file is never loaded by Nav2 runtime nodes.
benchmark:
  name: phase10_healthy_navigation
  repetitions: 3
  # One broad wall-clock allowance to establish only the facts needed before
  # sending NavigateToPose. It is not a cold-start performance metric.
  readiness_timeout_wall_sec: 120.0
  # Formal runs fail fast: retain first-failure evidence and repair its root
  # cause before starting a new complete 3 x 3 batch.
  infrastructure_start_attempts: 1
  scenario_order:
    - simple_reachable
    - static_obstacle_detour
    - multi_turn_healthy
  map_from_gt_odom: {x: 0.0, y: 0.0, yaw: 0.0}
  max_alignment_delta_sec: 0.05
  minimum_alignment_coverage: 0.95
  # This is deterministic minimum-period subsampling, not interpolated 20 Hz.
  gt_distance_minimum_sample_period_sec: 0.05
  maximum_invalid_gt_samples: 0
  max_feedback_navigation_time_delta_sec: 0.50
  initial_gt_position_tolerance_m: 0.05
  initial_gt_yaw_tolerance_rad: 0.05
  final_gt_position_error_m: 0.25
  final_gt_yaw_error_rad: 0.30
  final_stop_window_sim_sec: 1.0
  final_stop_translation_m: 0.01
  final_stop_yaw_rad: 0.02
  diagnostics_topics:
    - /clock
    - /map
    - /scan
    - /global_costmap/costmap_raw
    - /local_costmap/costmap_raw
    - /tf
    - /tf_static
    - /amcl_pose
    - /plan
    - /received_global_plan
    - /cmd_vel
    - /odometry/filtered
    - /evaluation/ground_truth_pose
    - /behavior_tree_log
