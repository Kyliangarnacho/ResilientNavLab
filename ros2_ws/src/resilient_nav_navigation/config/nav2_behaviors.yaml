# Phase 10 Task 5.3.  This is an opt-in official Nav2 Behavior Server profile;
# Task 1--5.2 retain their existing navigation chain and never load it.
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.10
    simulate_ahead_time: 2.0
    # Recovery-only behavior limits stay within the verified Task 3 command
    # envelope; they do not alter RPP or any Task 1--3 parameter.
    max_rotational_vel: 0.60
    min_rotational_vel: 0.40
    rotational_acc_lim: 1.50
