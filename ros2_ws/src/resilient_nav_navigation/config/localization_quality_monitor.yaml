    use_sim_time: true
    publish_rate_hz: 10.0
    startup_grace_sec: 3.0
    pose_age_warning_sec: 0.8
    pose_age_lost_sec: 2.0
    tf_age_warning_sec: 0.8
    tf_age_lost_sec: 2.0
    scan_health_age_warning_sec: 0.8
    scan_health_age_lost_sec: 2.0
    position_variance_warning: 0.5
    position_variance_lost: 2.0
    yaw_variance_warning: 0.3
    yaw_variance_lost: 1.0
    position_jump_warning_m: 0.75
    position_jump_lost_m: 2.0
    yaw_jump_warning_rad: 0.8
    yaw_jump_lost_rad: 1.6
    recovery_clean_observations: 2
    pose_future_tolerance_sec: 0.1
    tf_future_tolerance_sec: 1.5
    pose_jump_max_interval_sec: 1.0
