# Phase 10 Task 3.3.  BT Navigator orchestrates the existing Planner and
# Controller Servers; it deliberately owns no Costmap and no recovery server.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.10
    # BT tick period in milliseconds.  Periodic planning is defined by the
    # selected upstream XML's RateController (1 Hz), not by this value.
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
